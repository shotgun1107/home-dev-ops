name: ops-check

on:
  pull_request:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14.4'
      - name: Show tested revision and Python
        run: |
          git rev-parse HEAD
          python --version
      - name: Regression (125 verified tests)
        run: timeout 120s python -I -B scripts/run_ops_ci.py
